<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Swap - Student Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background: #f0fdf4;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }

        .btn-primary {
            background: #004d40;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
        }

        .btn-primary:hover {
            background: #00695c;
        }

        .form-control {
            border-radius: 8px;
            padding: 12px;
            background: #f9fafb;
            border: 1px solid #e5e7eb;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #004d40;
            text-align: center;
            margin-bottom: 24px;
        }
    </style>
</head>

<body>

    <div class="card p-4">
        <div class="logo">🌿 Campus Swap</div>
        <h5 class="text-center mb-4 text-secondary">Student Web Portal</h5>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="mb-3">
                <label class="form-label">Student Email</label>
                <input type="email" id="email" class="form-control" placeholder="student@university.edu.my" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" id="password" class="form-control" placeholder="•••••••" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Login</button>
            <p class="text-center mt-3 small">Don't have an account? Use the App.</p>
        </form>
    </div>

    <script>
        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // Verification
            if (!email.endsWith('.edu.my')) {
                alert("Only .edu.my emails are allowed.");
                return;
            }

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();
                if (res.ok) {
                    // Save session
                    localStorage.setItem('user_id', data.user.id);
                    localStorage.setItem('token', data.token); // If using tokens
                    window.location.href = 'dashboard.html';
                } else {
                    alert(data.error || 'Login failed');
                }
            } catch (err) {
                console.error(err);
                alert('Server error');
            }
        }
    </script>

</body>

</html>
